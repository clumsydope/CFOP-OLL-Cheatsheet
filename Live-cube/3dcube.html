<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,height=device-height,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/95/three.min.js"></script>
    <script defer src="cubealter.js"></script>
    <script  defer src="main.js"></script>
    <title>Rubik's Cube</title>
</head>
<body>

<div class="ui">

    <div class="ui__background"></div>
  
    <div class="play-layout">
      <div class="ui__game"></div>
      <div class="move-history-panel">
        <div class="move-history" aria-label="Move history" aria-live="polite"></div>
        <button class="move-history-reset" type="button" aria-label="Undo all moves" disabled>Reset</button>
        <div class="gamepad-legend" aria-label="Gamepad controls">
          <div class="gamepad-legend__title">Gamepad</div>
          <div class="gamepad-legend__grid">
            <div><kbd>A</kbd><span>F</span></div>
            <div><kbd>B</kbd><span>R</span></div>
            <div><kbd>X</kbd><span>L</span></div>
            <div><kbd>Y</kbd><span>U</span></div>
            <div><kbd>RB</kbd><span>D</span></div>
            <div><kbd>RT</kbd><span>B</span></div>
            <div><kbd>LB</kbd><span>Reverse</span></div>
            <div><kbd>LT</kbd><span>Slice</span></div>
            <div><kbd>LT + X</kbd><span>E</span></div>
            <div><kbd>LT + B</kbd><span>E'</span></div>
            <div><kbd>LT + Y</kbd><span>M</span></div>
            <div><kbd>LT + A</kbd><span>M'</span></div>
            <div><kbd>LT + RB</kbd><span>S</span></div>
            <div><kbd>LT + RT</kbd><span>S'</span></div>
            <div><kbd>Back</kbd><span>Undo</span></div>
            <div><kbd>LS + RS</kbd><span>Reset</span></div>
          </div>
        </div>
      </div>
    </div>
  
    <div class="ui__texts">
      <h1 class="text text--title">
        <span>THE</span>
        <span>CUBE</span>
      </h1>
      <div class="text text--note">
        <!-- Double tap to start -->
      </div>
      <div class="text text--timer">
        0:00
      </div>
      <div class="text text--complete">
        <span>Complete!</span>
      </div>
      <div class="text text--best-time">
        <icon trophy></icon>
        <span>Best Time!</span>
      </div>
    </div>
  
    <div class="ui__prefs">
      <!-- <range name="size" title="Cube Size" list="2,3,4,5"></range> -->
      <range name="flip" title="Flip Type" list="Swift&nbsp;,Smooth,Bounce"></range>
      <range name="scramble" title="Scramble Length" list="20,25,30"></range>
      <range name="fov" title="Camera Angle" list="Ortographic,Perspective"></range>
      <range name="theme" title="Color Scheme" list="Cube,Erno,Dust,Camo,Rain"></range>
    </div>
  
    <div class="ui__theme">
      <range name="hue" title="Hue" color></range>
      <range name="saturation" title="Saturation" color></range>
      <range name="lightness" title="Lightness" color></range>
    </div>
  
    <div class="ui__stats">
      <div class="stats" name="cube-size">
        <i>Cube:</i><b>3x3x3</b>
      </div>
      <div class="stats" name="total-solves">
        <i>Total solves:</i><b>-</b>
      </div>
      <div class="stats" name="best-time">
        <i>Best time:</i><b>-</b>
      </div>
      <div class="stats" name="worst-time">
        <i>Worst time:</i><b>-</b>
      </div>
      <div class="stats" name="average-5">
        <i>Average of 5:</i><b>-</b>
      </div>
      <div class="stats" name="average-12">
        <i>Average of 12:</i><b>-</b>
      </div>
      <div class="stats" name="average-25">
        <i>Average of 25:</i><b>-</b>
      </div>
    </div>
  
    <div class="ui__buttons">
      <button class="btn btn--bl btn--stats">
        <icon trophy></icon>
      </button>
      <button class="btn btn--br btn--prefs">
        <icon settings></icon>
      </button>
      <button class="btn btn--bl btn--back">
        <icon back></icon>
      </button>
      <button class="btn btn--br btn--theme">
        <icon theme></icon>
      </button>
      <button class="btn btn--bl btn--reset">
        <icon reset></icon>
      </button>
    </div>
  
  </div>
</body>
</html>
